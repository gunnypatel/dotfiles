# Fuzzy picker for the keybinds cheatsheet (any future --dmenu callers too).
# Theme matches the Noctalia community palette: Catppuccin Mocha Green.
# Font family matches the Noctalia bar (see ~/.config/noctalia/config.toml);
# size 16 + line-height padding keep the column-aligned rows easy to scan.
[main]
font=JetBrainsMono Nerd Font:size=16
anchor=center
lines=20
width=110
line-height=32
horizontal-pad=25
vertical-pad=20
inner-pad=10
exit-on-keyboard-focus-loss=yes

[colors]
background=1e1e2edd
text=cdd4f4ff
match=a6e3a1ff
selection=313244ff
selection-text=cdd4f4ff
selection-match=a6e3a1ff
border=a6e3a1ff
