# Managed by chezmoi. Runtime saves are disabled so this file stays as
# deployed — change settings here, not in the RetroArch UI (which would
# otherwise rewrite the file on exit). RetroArch fills every unset
# option from compiled defaults.
# Stack: docs/superpowers/specs/2026-10-03-couch-emulation-streaming-design.md

config_save_on_exit = "false"

# Input: force SDL for both context input and joypads. In the ES-DE
# launch context RA auto-picks input_driver="x" + joypad "udev", and
# udev has no autoconfig for Sunshine's emulated DualSense (1356/3302)
# -> pad bound but every button unmapped (verified 2026-10-11,
# ~/retroarch.log). SDL maps the DualSense natively via its
# gamecontroller DB — proven working in the flatpak RA menu probe.
input_driver = "sdl2"
input_joypad_driver = "sdl2"

# Video: fullscreen on the dongle output (routed by couch-route during
# streams; 4K stream since 2026-10-11). Windowed 3072x1728 geometry was
# local-testing-only and removed — windowed mode floated a small window
# top-left on the dongle.
video_driver = "vulkan"
video_fullscreen = "true"
video_vsync = "true"
# Stream latency is encoder-side; hard sync only adds local GPU stalls.
video_hard_sync = "false"

# Controller exit convention (RetroPad indices: 2 = Select, 3 = Start):
#   Select (hold) + Start   quit emulator -> back to ES-DE
#   L3 + R3                 RetroArch menu (gamepad combo 2)
input_enable_hotkey_btn = "2"
input_exit_emulator_btn = "3"
input_menu_toggle_gamepad_combo = "2"
